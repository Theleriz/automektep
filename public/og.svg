<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AutoMektep — автомектепті басқару жүйесі">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141C33"/>
      <stop offset=".55" stop-color="#1B2550"/>
      <stop offset="1" stop-color="#0F1524"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD34E"/>
      <stop offset="1" stop-color="#F7B801"/>
    </linearGradient>
    <radialGradient id="glow1" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4361EE" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4361EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#F7B801" stop-opacity=".45"/>
      <stop offset="1" stop-color="#F7B801" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="120" cy="70" r="420" fill="url(#glow1)"/>
  <circle cx="1120" cy="580" r="400" fill="url(#glow2)"/>

  <!-- Логотип -->
  <rect x="80" y="86" width="96" height="96" rx="28" fill="url(#logo)"/>
  <g transform="translate(104 110)" fill="none" stroke="#141C33" stroke-width="5.5" stroke-linecap="round">
    <circle cx="24" cy="24" r="18"/>
    <circle cx="24" cy="24" r="5"/>
    <path d="M6 19h12M30 19h12M24 29v14"/>
  </g>

  <text x="200" y="152" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" letter-spacing="-.5">AutoMektep</text>
  <text x="202" y="188" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="500" fill="#93A0B8">автомектепті басқару жүйесі</text>

  <text x="80" y="320" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="62" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Жүргізуші куәлігіне</text>
  <text x="80" y="392" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="62" font-weight="800" fill="#FFD34E" letter-spacing="-1.5">сенімді жол</text>
  <text x="82" y="446" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="25" font-weight="500" fill="#C5CEE3">Теория · Практика · Емтихан · Жеке кабинет</text>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600">
    <rect x="80" y="496" width="168" height="60" rx="16" fill="#22305A"/>
    <text x="112" y="534" fill="#A9B8FF">15 санат</text>
    <rect x="264" y="496" width="196" height="60" rx="16" fill="#22305A"/>
    <text x="296" y="534" fill="#A9B8FF">Онлайн тест</text>
    <rect x="476" y="496" width="232" height="60" rx="16" fill="#22305A"/>
    <text x="508" y="534" fill="#A9B8FF">Жеке кабинет</text>
  </g>

  <g transform="translate(812 300)" opacity=".95">
    <rect x="0" y="0" width="308" height="240" rx="24" fill="#182033" stroke="#2A3550" stroke-width="2"/>
    <rect x="24" y="26" width="120" height="14" rx="7" fill="#2A3550"/>
    <rect x="24" y="60" width="260" height="10" rx="5" fill="#22305A"/>
    <rect x="24" y="80" width="200" height="10" rx="5" fill="#22305A"/>
    <circle cx="52" cy="136" r="22" fill="#F7B801"/>
    <rect x="88" y="122" width="150" height="12" rx="6" fill="#2A3550"/>
    <rect x="88" y="144" width="100" height="10" rx="5" fill="#22305A"/>
    <rect x="24" y="184" width="260" height="12" rx="6" fill="#22305A"/>
    <rect x="24" y="184" width="176" height="12" rx="6" fill="#4361EE"/>
  </g>
</svg>
